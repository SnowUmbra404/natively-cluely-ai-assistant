name: Build macOS DMG (unsigned)

# Builds an UNSIGNED, arm64-only macOS DMG on GitHub's Apple Silicon runner and
# uploads it as a workflow artifact. For forks with no Apple Developer secrets
# and no access to the private premium/natively-api submodules. Uses the default
# electron-builder config (mac.identity: null → ad-hoc signed, not notarized).
#
# arm64-only + dmg-only on purpose: the runner is arm64, and the .zip target
# only exists for electron-updater auto-updates (unused by a fork). This keeps
# the artifact to a single ~740MB DMG instead of ~3.2GB of x64+arm64 dmg+zip.
#
# The app is fully functional minus the org's private knowledge/premium layer,
# which is loaded via optional require() and skipped when absent.
#
# NOTE: an unsigned/ad-hoc app is gatekeeper-quarantined on download. To launch:
#   xattr -dr com.apple.quarantine /Applications/Natively.app

on:
  push:
    branches: [main]
  workflow_dispatch: {} # also runnable manually from the Actions tab

# Cancel an in-progress build when a newer push to the same ref arrives.
concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-unsigned:
    runs-on: macos-14 # Apple Silicon runner
    timeout-minutes: 90
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        # No submodules: premium/natively-api are private and not required.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' # caches the npm download cache (~/.npm)

      - name: Setup Rust (native module)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin # arm64 only

      # Caches the cargo registry + native-module/target across runs. This is
      # the biggest single build-time win after arm64-only — the Rust native
      # module no longer recompiles from scratch each run.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-module

      # Caches the downloaded Electron binary + electron-builder tooling so they
      # aren't re-fetched every run. Keyed on the lockfile (electron version).
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      # Explicit stages (mirrors the signed workflow) rather than `npm run dist`.
      # No NATIVELY_BUILD_ALL_MAC_ARCHES → build:native compiles arm64 only.
      # electron-builder --arm64 → single-arch dmg (+ zip, which we don't upload).
      - name: Build unsigned DMG (arm64)
        run: |
          set -euo pipefail
          npm run build
          npm run build:electron
          npm run build:native
          node scripts/ensure-sharp-mac-deps.js
          ./node_modules/.bin/electron-builder --mac --arm64 --publish never

      - name: Report DMG size
        run: ls -lh release/*.dmg || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: natively-macos-arm64-unsigned
          path: release/*.dmg
          if-no-files-found: error
